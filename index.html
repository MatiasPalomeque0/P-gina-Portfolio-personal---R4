<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Resolver el tema antes de pintar la página evita el destello inicial.
      ;(() => {
        let savedTheme
        try {
          savedTheme = localStorage.getItem('portfolio-theme')
        } catch {
          // El modo privado puede bloquear localStorage; se usa el sistema.
        }
        document.documentElement.dataset.theme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
      })()
    </script>
    <meta
      name="description"
      content="Portfolio personal desarrollado con React, TypeScript y Vite."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Portfolio personal | R4</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
